<svg xmlns="http://www.w3.org/2000/svg" style="display:none" aria-hidden="true">
  <!-- Repère - bibliothèque d'icônes v2.2 -->
  <!-- L'identifiant du symbole est le nom du fichier, sans extension. Aucune table de correspondance. -->
  <!-- stroke-width est volontairement absent : il est porté par le <svg> hôte (cf. composant Icon). -->

  <!-- 10 icônes de domaine -->
  <symbol id="course_icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"><title>Cours</title><path d="M3.5 5.5h5a3.5 3.5 0 0 1 3.5 3.5v10a2.5 2.5 0 0 0-2.5-2.5h-6z"/><path d="M20.5 5.5h-5A3.5 3.5 0 0 0 12 9v10a2.5 2.5 0 0 1 2.5-2.5h6z"/></symbol>
  <symbol id="schedule_icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"><title>Planning</title><rect x="3.5" y="5.5" width="17" height="15" rx="2.5"/><path d="M3.5 10.5h17"/><path d="M8 3.5v4"/><path d="M16 3.5v4"/><path d="M7.5 14.5h3"/><path d="M13.5 14.5h3"/><path d="M7.5 17.5h3"/></symbol>
  <symbol id="flashcard_icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"><title>Cartes mémoire</title><path d="M7 5.5h11a2.5 2.5 0 0 1 2.5 2.5v8"/><rect x="2.5" y="8.5" width="14" height="11" rx="2.5"/><path d="M6 12.5h7"/><path d="M6 15.5h4"/></symbol>
  <symbol id="quiz_icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"><title>Quiz</title><rect x="3.5" y="4" width="4" height="4" rx="1.2"/><path d="M10.5 6h10"/><rect x="3.5" y="10" width="4" height="4" rx="1.2"/><path d="M10.5 12h10"/><rect x="3.5" y="16" width="4" height="4" rx="1.2"/><path d="M10.5 18h6"/></symbol>
  <symbol id="progress_icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"><title>Progression</title><path d="M2.75 21.25h4.41v-4.41h4.41v-4.41h4.42v-4.42h4.41v-4.41"/><circle cx="20.4" cy="3.6" r="1.6" fill="currentColor" stroke="none"/></symbol>
  <symbol id="timer_icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"><title>Session focus</title><circle cx="12" cy="13.75" r="7.5"/><path d="M12 9.75v4l2.5 2"/><path d="M9.5 2.75h5"/><path d="M12 2.75v3.5"/></symbol>
  <symbol id="note_icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"><title>Notes</title><path d="M14 3.5H6.5A1.5 1.5 0 0 0 5 5v14a1.5 1.5 0 0 0 1.5 1.5h11A1.5 1.5 0 0 0 19 19V8.5z"/><path d="M14 3.5v5h5"/><path d="M8.5 13h7"/><path d="M8.5 16.5h4.5"/></symbol>
  <symbol id="goal_icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"><title>Objectif</title><path d="M5.5 20.5V3.5"/><path d="M5.5 4.5h13l-3 4 3 4h-13"/></symbol>
  <symbol id="study_group_icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"><title>Groupe d’étude</title><circle cx="9.5" cy="8.5" r="3.5"/><path d="M3.5 19.5a6 6 0 0 1 12 0"/><path d="M16.2 5.7a3.5 3.5 0 0 1 0 5.6"/><path d="M17.6 14.4a6 6 0 0 1 2.9 5.1"/></symbol>
  <symbol id="add_course_icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"><title>Ajouter</title><circle cx="12" cy="12" r="8.5"/><path d="M12 8.5v7"/><path d="M8.5 12h7"/></symbol>

  <!-- variante -->
  <symbol id="schedule_icon_sm" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"><title>Planning — variante 16 px</title><rect x="3.5" y="5.5" width="17" height="15" rx="2.5"/><path d="M3.5 10.5h17"/><path d="M8 3.5v4"/><path d="M16 3.5v4"/></symbol>

  <!-- glyphes système - hors périmètre Projet 8 -->
  <symbol id="disclosure_icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"><title>Ouvrir le détail (chevron)</title><path d="M9.5 5.5l7 6.5-7 6.5"/></symbol>
