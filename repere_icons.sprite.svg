  <symbol id="close_icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"><title>Fermer</title><path d="M6 6l12 12"/><path d="M18 6L6 18"/></symbol>
  <symbol id="check_icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"><title>Valider</title><path d="M4.5 12.5l5 5 10-10"/></symbol>
  <symbol id="search_icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"><title>Rechercher</title><circle cx="10.5" cy="10.5" r="6.5"/><path d="M15.5 15.5l4.5 4.5"/></symbol>
  <symbol id="settings_icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"><title>Réglages</title><path d="M4 7.5h10"/><path d="M18 7.5h2"/><circle cx="16" cy="7.5" r="2"/><path d="M4 16.5h4"/><path d="M12 16.5h8"/><circle cx="10" cy="16.5" r="2"/></symbol>
  <symbol id="offline_icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"><title>Hors ligne</title><path d="M6.5 17.5h10a3.5 3.5 0 0 0 1.2-6.8A5.5 5.5 0 0 0 8.4 8.1"/><path d="M6.5 17.5a3.5 3.5 0 0 1-.4-7"/><path d="M3.5 3.5l17 17"/></symbol>
  <symbol id="invite_link_icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"><title>Lien d’invitation</title><path d="M10 14a3.5 3.5 0 0 1 0-5l3-3a3.5 3.5 0 0 1 5 5l-1.5 1.5"/><path d="M14 10a3.5 3.5 0 0 1 0 5l-3 3a3.5 3.5 0 0 1-5-5L7.5 11.5"/></symbol>
  <symbol id="play_icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"><title>Démarrer</title><path d="M7.5 4.8l11 7.2-11 7.2z"/></symbol>
  <symbol id="pause_icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"><title>Mettre en pause</title><path d="M9.5 5.5v13"/><path d="M14.5 5.5v13"/></symbol>
</svg>